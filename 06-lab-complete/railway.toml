# Railway — build bằng Dockerfile, healthcheck /health.
# App lắng nghe theo biến PORT do Railway cấp (xử lý trong CMD của Dockerfile).
# Biến môi trường đặt trên Railway (không ghi ở đây):
#   AGENT_API_KEY (secret), REDIS_URL=${{Redis.REDIS_URL}}, ENVIRONMENT=production,
#   RATE_LIMIT_PER_MINUTE, DAILY_BUDGET_USD, MONTHLY_BUDGET_USD

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
