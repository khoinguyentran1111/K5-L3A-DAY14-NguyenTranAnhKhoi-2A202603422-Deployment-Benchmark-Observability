# ============================================================
# Agent + Redis bằng một lệnh:  docker compose up --build
#   • agent: build từ Dockerfile, đọc thêm env từ .env (không bắt buộc có file)
#   • redis: redis:7-alpine, có healthcheck, dữ liệu giữ trong volume
# ============================================================
services:
  agent:
    build: .
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8000"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
