# Render Blueprint — web service (Docker) + Key Value (Redis).
# File nằm trong 06-lab-complete/: khi tạo Blueprint, chỉ định Blueprint path = 06-lab-complete/render.yaml.
services:
  - type: web
    name: day14-production-agent
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./06-lab-complete/Dockerfile
    dockerContext: ./06-lab-complete
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        sync: false            # nhập trong dashboard, không ghi giá trị vào repo
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  - type: keyvalue
    name: day14-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []            # chỉ service nội bộ trong Render truy cập được
